<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="50%" stop-color="#af002d"/>
      <stop offset="100%" stop-color="#380036"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0f1724" rx="8" ry="8" />
  <g>
    <text x="60" y="90" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="44" font-weight="700" fill="url(#g)">Dynamic Programming</text>
    <text x="60" y="125" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#9AA6B2">Problems · Solutions · Approaches · Notes</text>
    <g id="lines" fill="none" stroke="url(#g2)" stroke-width="4" stroke-linecap="round" opacity="0.95">
      <rect x="-600" y="160" width="500" height="4" rx="2" fill="url(#g2)">
        <animate attributeName="x" from="-600" to="1200" dur="6s" repeatCount="indefinite" />
      </rect>
      <rect x="-800" y="186" width="700" height="4" rx="2" fill="url(#g2)">
        <animate attributeName="x" from="-800" to="1200" dur="9s" repeatCount="indefinite" />
      </rect>
      <rect x="-1000" y="212" width="900" height="4" rx="2" fill="url(#g2)">
        <animate attributeName="x" from="-1000" to="1200" dur="12s" repeatCount="indefinite" />
      </rect>
    </g>
    <text x="60" y="50" font-size="12" fill="#A3B1C2">Modern · Classic · Aesthetic</text>
    <text x="940" y="220" font-size="12" fill="#CBD5E1" text-anchor="end" opacity="0.9">by @tanmaychauhan12</text>
  </g>
</svg>
